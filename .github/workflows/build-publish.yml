name: Build and Publish Distroless fastp

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Upgraded to v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # Recommended for modern build-push-action

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v5 # Upgraded to v5 to prevent further deprecation warnings
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: picotainers/fastp:latest

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
